<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacium-G Sevenger - Cloud Monitoring</title>
  <style>
    body { margin:0; padding:20px; font-family:'Segoe UI',sans-serif; background:#0f172a; color:#f8fafc; text-align:center; }
    .container { max-width:500px; margin:0 auto; background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
    h1 { color:#38bdf8; font-size:1.4rem; margin-bottom:2px; }
    .sub { color:#94a3b8; font-size:0.8rem; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px; }
    .card { background:#334155; padding:15px 8px; border-radius:8px; border:1px solid #475569; }
    .val { font-size:1.2rem; font-weight:bold; margin-top:5px; }
    .lbl { font-size:0.7rem; color:#cbd5e1; text-transform:uppercase; }
    .status { padding:12px; border-radius:8px; font-weight:bold; font-size:1rem; margin-top:15px; }
    .safe { background:rgba(74,222,128,0.15); color:#4ade80; border:1px solid #4ade80; }
    .danger { background:rgba(248,113,113,0.15); color:#f87171; border:1px solid #f87171; animation:blink 1s infinite; }
    .muted { background:rgba(250,204,21,0.15); color:#facc15; border:1px solid #facc15; }
    @keyframes blink { 0% {opacity:1;} 50% {opacity:0.4;} 100% {opacity:1;} }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 SPACIUM-G SEVENGER</h1>
    <div class="sub">Cloud Dashboard Monitoring (Vercel & Firebase)</div>
    <div class="grid">
      <div class="card"><div class="lbl">Suhu</div><div class="val"><span id="suhu">0</span>&deg;C</div></div>
      <div class="card"><div class="lbl">Kelembaban</div><div class="val"><span id="hum">0</span>%</div></div>
      <div class="card"><div class="lbl">Gas / Asap</div><div class="val"><span id="gas">0</span></div></div>
    </div>
    <div id="status-box" class="status safe">MENUNGGU DATA...</div>
  </div>

  <script>
    // URL Firebase Asia-Southeast1 Anda
    const FIREBASE_URL = "https://spaciumg-dccc9-default-rtdb.asia-southeast1.firebasedatabase.app/sensor.json";

    function fetchCloudData() {
      fetch(FIREBASE_URL)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          document.getElementById('suhu').innerText = data.suhu ? data.suhu.toFixed(1) : "0";
          document.getElementById('hum').innerText = data.kelembaban ? data.kelembaban.toFixed(1) : "0";
          document.getElementById('gas').innerText = data.gas || "0";

          const sb = document.getElementById('status-box');
          sb.innerText = data.status || 'MENUNGGU DATA...';
          sb.className = 'status ' + (data.kondisi || 'safe');
        })
        .catch(err => console.error("Error fetch:", err));
    }

    setInterval(fetchCloudData, 1000);
    fetchCloudData();
  </script>
</body>
</html>
